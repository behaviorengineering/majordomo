id: majordomo
slices:
    - id: review
      objective: Automate pull request review from staged changes through published findings.
      owns:
        - id: internal-staging
          path: ./internal/staging
          layer: domain
        - id: internal-cluster
          path: ./internal/cluster
          layer: domain
        - id: internal-diff
          path: ./internal/diff
          layer: domain
        - id: internal-sa
          path: ./internal/sa
          layer: domain
        - id: internal-satools
          path: ./internal/satools
          layer: domain
        - id: internal-orchestrate
          path: ./internal/orchestrate
          layer: domain
        - id: internal-filereview
          path: ./internal/filereview
          layer: domain
        - id: internal-reviewrun
          path: ./internal/reviewrun
          layer: domain
        - id: internal-judge
          path: ./internal/judge
          layer: domain
        - id: internal-judge-evaluation-digest
          path: ./internal/judge/evaluation/digest
          layer: domain
        - id: internal-judge-evaluation-summary
          path: ./internal/judge/evaluation/summary
          layer: domain
        - id: internal-judge-evaluation-tech
          path: ./internal/judge/evaluation/tech
          layer: domain
        - id: internal-judge-modules
          path: ./internal/judge/modules
          layer: domain
        - id: internal-agent
          path: ./internal/agent
          layer: domain
        - id: internal-workspace
          path: ./internal/workspace
          layer: domain
        - id: internal-workspace-opencode
          path: ./internal/workspace/opencode
          layer: domain
        - id: internal-report
          path: ./internal/report
          layer: domain
        - id: internal-cache
          path: ./internal/cache
          layer: domain
        - id: internal-publish
          path: ./internal/publish
          layer: domain
        - id: internal-status
          path: ./internal/status
          layer: domain
      docs:
        pages:
            - kind: overview
              path: docs/develop/review/overview.md
            - kind: components
              path: docs/develop/review/components.md
    - id: context
      objective: Maintain durable repository context for consistent review jobs.
      owns:
        - id: internal-contextstore
          path: ./internal/contextstore
          layer: domain
        - id: internal-contextdigest
          path: ./internal/contextdigest
          layer: domain
        - id: internal-contextgate
          path: ./internal/contextgate
          layer: domain
        - id: internal-agenting
          path: ./internal/agenting
          layer: domain
      docs:
        pages:
            - kind: overview
              path: docs/develop/context/overview.md
            - kind: components
              path: docs/develop/context/components.md
    - id: operations
      objective: Run the control plane and connect review workflows to external systems.
      owns:
        - id: internal-poll
          path: ./internal/poll
          layer: domain
        - id: internal-outbound
          path: ./internal/outbound
          layer: domain
        - id: internal-githttps
          path: ./internal/githttps
          layer: domain
        - id: internal-config
          path: ./internal/config
          layer: domain
        - id: internal-aigateway
          path: ./internal/aigateway
          layer: domain
        - id: internal-observability
          path: ./internal/observability
          layer: domain
        - id: internal-submodule
          path: ./internal/submodule
          layer: domain
      surfaces:
        - id: operations-cli
          kind: cli
          components:
            - id: internal-cli
              path: ./internal/cli
            - id: cmd-majordomo
              path: ./cmd/majordomo
      docs:
        pages:
            - kind: overview
              path: docs/develop/operations/overview.md
            - kind: components
              path: docs/develop/operations/components.md
            - kind: cli
              path: docs/develop/operations/cli.md
sliceBindings:
    - from: context
      to: operations
      kind: reads
    - from: context
      to: review
      kind: reads
    - from: operations
      to: context
      kind: reads
    - from: operations
      to: review
      kind: reads
    - from: review
      to: context
      kind: reads
    - from: review
      to: operations
      kind: reads
