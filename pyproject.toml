[project]
name = "majordomo"
version = "0.1.0"
description = "Repository operations for evolving software."
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "ruff>=0.9",
    "types-markdown>=3.7",
]
pipeline = [
    "markdown>=3.7",
]

# ---------------------------------------------------------------------------
# Ruff — linter + formatter
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 88
src = ["scripts"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "ARG",    # unused arguments (ARG001)
    "TC",     # type-checking imports (TC002)
    "PLC",    # pylint convention (PLC0415 — no in-function imports)
    "PLR",    # pylint refactor (PLR2004 — magic values)
]

[tool.ruff.lint.isort]
known-first-party = ["scripts"]

# ---------------------------------------------------------------------------
# Mypy — strict type checking
# ---------------------------------------------------------------------------

[tool.mypy]
strict = true
python_version = "3.14"
files = ["scripts"]
