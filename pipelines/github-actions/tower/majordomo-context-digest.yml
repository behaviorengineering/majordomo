# Reference: context digest cron (matrix per served repo).
# Canonical source — copy to YOUR_TOWER/.github/workflows/majordomo-context-digest.yml
name: majordomo-context-digest

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    env:
      MAJORDOMO_GH_IMAGE: ${{ vars.MAJORDOMO_GH_IMAGE }}
      MAJORDOMO_GLAB_IMAGE: ${{ vars.MAJORDOMO_GLAB_IMAGE }}
      MAJORDOMO_IMAGE: ${{ vars.MAJORDOMO_IMAGE }}
      TOWER_SCRIPTS: ${{ github.workspace }}/.majordomo/pipelines/scripts/tower
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: bash "${TOWER_SCRIPTS}/extract-majordomo-cli.sh" "${MAJORDOMO_IMAGE}" "${{ github.workspace }}/majordomo"
      - name: Build Typology CLI
        run: |
          set -euo pipefail
          GOBIN="${{ github.workspace }}" go install github.com/behaviorengineering/typology/cmd/typology@v0.0.8
          chmod +x "${{ github.workspace }}/typology"
      - id: plan
        run: |
          set -euo pipefail
          ./majordomo context repos --config-dir majordomo-central-config --out context-repos.json
          matrix=$(bash "${TOWER_SCRIPTS}/enrich-context-repos-matrix.sh" context-repos.json)
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: majordomo-cli
          path: majordomo
      - uses: actions/upload-artifact@v7
        with:
          name: typology-cli
          path: typology

  digest:
    needs: plan
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.forge_image }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      REPO_ID: ${{ matrix.repo_id }}
      SCM: ${{ matrix.scm }}
      MODULE_SCOPE: ${{ matrix.module_scope || '' }}
      TOWER_SCRIPTS: ${{ github.workspace }}/.majordomo/pipelines/scripts/tower
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/download-artifact@v8
        with:
          name: majordomo-cli
          path: ${{ github.workspace }}
      - uses: actions/download-artifact@v8
        with:
          name: typology-cli
          path: ${{ github.workspace }}
      - run: chmod +x "${{ github.workspace }}/majordomo" "${{ github.workspace }}/typology"
      - run: bash "${TOWER_SCRIPTS}/verify-forge-cli.sh"
      - run: bash "${TOWER_SCRIPTS}/clone-served-repo.sh" served/repo
      - run: |
          set -euo pipefail
          ./majordomo context digest \
            --config-dir majordomo-central-config \
            --repo-id "${REPO_ID}" \
            --workdir "${PWD}/served/repo" \
            --typology-binary "${PWD}/typology" \
            --module-scope "${MODULE_SCOPE}" \
            --bootstrap-survey-policy auto \
            --out digest-result.json
