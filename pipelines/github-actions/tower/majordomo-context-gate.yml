# Reference: single-repo context gate (resolve scm then containerized digest).
# Canonical source — copy to YOUR_TOWER/.github/workflows/majordomo-context-gate.yml
name: majordomo-context-gate

on:
  repository_dispatch:
    types: [context-gate]
  workflow_dispatch:
    inputs:
      repo_id:
        required: true
        type: string

permissions:
  contents: read
  packages: read
  pull-requests: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      scm: ${{ steps.meta.outputs.scm }}
      forge_image: ${{ steps.meta.outputs.forge_image }}
    env:
      MAJORDOMO_GH_IMAGE: ${{ vars.MAJORDOMO_GH_IMAGE }}
      MAJORDOMO_GLAB_IMAGE: ${{ vars.MAJORDOMO_GLAB_IMAGE }}
      MAJORDOMO_IMAGE: ${{ vars.MAJORDOMO_IMAGE }}
      TOWER_SCRIPTS: ${{ github.workspace }}/.majordomo/pipelines/scripts/tower
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: bash "${TOWER_SCRIPTS}/extract-majordomo-cli.sh" "${MAJORDOMO_IMAGE}" "${{ github.workspace }}/majordomo"
      - name: Build Typology CLI
        run: |
          set -euo pipefail
          GOBIN="${{ github.workspace }}" go install github.com/behaviorengineering/typology/cmd/typology@v0.0.8
          chmod +x "${{ github.workspace }}/typology"
      - id: meta
        run: |
          set -euo pipefail
          scm=github
          img=$(bash "${TOWER_SCRIPTS}/resolve-forge-image.sh" "${scm}")
          echo "scm=${scm}" >> "$GITHUB_OUTPUT"
          echo "forge_image=${img}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: majordomo-cli
          path: majordomo
      - uses: actions/upload-artifact@v7
        with:
          name: typology-cli
          path: typology

  digest:
    needs: resolve
    defaults:
      run:
        shell: bash
    container:
      image: ${{ needs.resolve.outputs.forge_image }}
    env:
      REPO_ID: ${{ github.event.client_payload.repo_id || github.event.inputs.repo_id }}
      MODULE_SCOPE: ${{ github.event.client_payload.module_scope || github.event.inputs.module_scope || '' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: majordomo-cli
          path: ${{ github.workspace }}
      - uses: actions/download-artifact@v8
        with:
          name: typology-cli
          path: ${{ github.workspace }}
      - run: chmod +x "${{ github.workspace }}/majordomo" "${{ github.workspace }}/typology"
      - run: bash .majordomo/pipelines/scripts/tower/verify-forge-cli.sh
      - run: bash .majordomo/pipelines/scripts/tower/clone-served-repo.sh served/repo
      - run: |
          set -euo pipefail
          ./majordomo context digest \
            --config-dir majordomo-central-config \
            --repo-id "${REPO_ID}" \
            --workdir "${PWD}/served/repo" \
            --typology-binary "${PWD}/typology" \
            --module-scope "${MODULE_SCOPE}" \
            --bootstrap-survey-policy auto \
            --out digest-result.json
