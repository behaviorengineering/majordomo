# Reference: PR review in SCM-matching forge container.
# Canonical source — copy to YOUR_TOWER/.github/workflows/majordomo-review.yml
# Set MAJORDOMO_GH_IMAGE / MAJORDOMO_GLAB_IMAGE repository variables.
name: majordomo-review

on:
  repository_dispatch:
    types: [majordomo-review]
  workflow_dispatch:
    inputs:
      repo_id:
        required: true
        type: string
      review_id:
        required: false
        type: string
      pr_number:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      base_branch:
        required: true
        type: string
      clone_url:
        required: true
        type: string
      scm:
        required: false
        default: github
        type: string
      forge_image:
        required: false
        type: string

permissions:
  contents: read
  packages: read
  pull-requests: write
  statuses: write

jobs:
  review:
    runs-on: ubuntu-latest
    container:
      image: ${{ github.event.client_payload.forge_image || inputs.forge_image || ((github.event.client_payload.scm || inputs.scm || 'github') == 'gitlab' && vars.MAJORDOMO_GLAB_IMAGE) || ((github.event.client_payload.scm || inputs.scm || 'github') == 'github' && vars.MAJORDOMO_GH_IMAGE) || '' }}
    env:
      SCM: ${{ github.event.client_payload.scm || inputs.scm || 'github' }}
      TOWER_SCRIPTS: ${{ github.workspace }}/.majordomo/pipelines/scripts/tower
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version-file: .majordomo/go.mod
      - run: go build -o "${{ github.workspace }}/majordomo" ./cmd/majordomo
        working-directory: .majordomo
      - name: Verify forge CLI on PATH
        if: env.SCM == 'github' || env.SCM == 'gitlab'
        run: bash "${TOWER_SCRIPTS}/verify-forge-cli.sh"
      # … tower-specific: run review, publish, poll cursor (see xynova/majordomo-tower)
