version: "3"

vars:
  BIN: majordomo{{exeExt}}

env:
  GOWORK: "off"

tasks:
  default:
    desc: List local-dev tasks
    cmds:
      - go tool task --list

  format:
    desc: Format with gofumpt
    summary: Format Go source files with the pinned gofumpt tool.
    cmds:
      - go tool gofumpt -w ./cmd ./internal ./pkg

  lint:
    desc: Run golangci-lint
    summary: Run the pinned golangci-lint configuration across the Go packages.
    cmds:
      - go tool golangci-lint run --timeout 5m ./cmd/... ./internal/... ./pkg/...

  vet:
    desc: Run go vet
    summary: Run the Go compiler's vet checks across the Go packages.
    cmds:
      - go vet ./cmd/... ./internal/... ./pkg/...

  test:
    desc: Run unit tests
    summary: Run the complete Go test suite.
    cmds:
      - go test ./...

  build:
    desc: Build majordomo CLI
    summary: Build the majordomo command into the repository root.
    cmds:
      - go build -o {{.BIN}} ./cmd/majordomo

  hooks-install:
    desc: Install Lefthook from cursor-packs
    summary: Initialize the shared pack and install the repository hooks.
    cmds:
      - git submodule update --init .cursor/packs/shared
      - lefthook install
