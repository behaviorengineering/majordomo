version: "3"

vars:
  BIN: majordomo{{exeExt}}

env:
  GOWORK: "off"

tasks:
  default:
    desc: List local-dev tasks
    summary: Lists local development tasks.
    cmds:
      - go tool task --list

  format:
    desc: Format with gofumpt
    summary: Formats Go source under cmd, internal, and pkg.
    cmds:
      - go tool gofumpt -w ./cmd ./internal ./pkg

  lint:
    desc: Run golangci-lint
    summary: Runs the pinned golangci-lint configuration for cmd, internal, and pkg.
    cmds:
      - go tool golangci-lint run --timeout 5m ./cmd/... ./internal/... ./pkg/...

  vet:
    desc: Run go vet
    summary: Runs go vet for cmd, internal, and pkg.
    cmds:
      - go vet ./cmd/... ./internal/... ./pkg/...

  test:
    desc: Run unit tests
    summary: Runs all Go unit tests.
    cmds:
      - go test ./...

  build:
    desc: Build majordomo CLI
    summary: Builds the majordomo CLI binary.
    cmds:
      - go build -o {{.BIN}} ./cmd/majordomo

  hooks-install:
    desc: Install Lefthook from cursor-packs
    summary: Installs the repository commit hooks.
    cmds:
      - git submodule update --init .cursor/packs/shared
      - lefthook install
