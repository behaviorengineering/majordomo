name: secret-scan

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  betterleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Betterleaks
        env:
          BETTERLEAKS_VERSION: "1.8.1"
          # linux_x64 checksum from
          # https://github.com/betterleaks/betterleaks/releases/download/v1.8.1/checksums.txt
          BETTERLEAKS_SHA256: "efa407244e1ea8e35f582b8a42becdeac08bdead04f68eb752adda722d583c2a"
        run: |
          set -euo pipefail
          archive="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/${archive}"
          curl -fsSL "$url" -o "$archive"
          echo "${BETTERLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" betterleaks
          sudo install -m 0755 betterleaks /usr/local/bin/betterleaks
          betterleaks version

      - name: Run Betterleaks
        # Local git/dir scans only; validation stays off (no outbound secret checks).
        run: betterleaks git . --config .betterleaks.toml --no-banner --redact --exit-code 1
